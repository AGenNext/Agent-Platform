apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autonomyxmanifests.autonomyx.io
spec:
  group: autonomyx.io
  scope: Namespaced
  names:
    plural: autonomyxmanifests
    singular: autonomyxmanifest
    kind: AutonomyxManifest
    shortNames:
      - axm
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [domain, apps]
              properties:
                domain:
                  type: string
                  minLength: 1
                protocol:
                  type: object
                  properties:
                    pinnedTo:
                      type: string
                    source:
                      type: string
                invariants:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                standards:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                apps:
                  type: array
                  items:
                    type: object
                    required: [name, tier, domain]
                    properties:
                      name:
                        type: string
                      tier:
                        type: string
                        enum: [foundation, governance, runtime, oam, experience]
                      domain:
                        type: string
                      component:
                        type: string
                      traits:
                        type: array
                        items:
                          type: string
                      workflows:
                        type: array
                        items:
                          type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
                certified:
                  type: boolean
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Certified
          type: boolean
          jsonPath: .status.certified
