apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certifications.autonomyx.io
spec:
  group: autonomyx.io
  scope: Namespaced
  names:
    plural: certifications
    singular: certification
    kind: Certification
    shortNames:
      - axc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [domain, subject, provenance]
              properties:
                domain:
                  type: string
                subject:
                  type: string
                provenance:
                  type: object
                  required: [source, digest]
                  properties:
                    source:
                      type: string
                    digest:
                      type: string
                    sbomRef:
                      type: string
                    signatureRef:
                      type: string
                    slsaLevel:
                      type: string
                validFrom:
                  type: string
                  format: date-time
                validUntil:
                  type: string
                  format: date-time
            status:
              type: object
              properties:
                phase:
                  type: string
                certified:
                  type: boolean
                trustScore:
                  type: number
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Subject
          type: string
          jsonPath: .spec.subject
        - name: Certified
          type: boolean
          jsonPath: .status.certified
        - name: Trust
          type: number
          jsonPath: .status.trustScore
