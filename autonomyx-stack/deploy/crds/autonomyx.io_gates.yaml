apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gates.autonomyx.io
spec:
  group: autonomyx.io
  scope: Namespaced
  names:
    plural: gates
    singular: gate
    kind: Gate
    shortNames:
      - axg
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [domain, policyRef, mode]
              properties:
                domain:
                  type: string
                mode:
                  type: string
                  enum: [deny-by-default]
                policyRef:
                  type: string
                trustThreshold:
                  type: number
                  default: 0.5
                jitAccess:
                  type: boolean
                  default: true
                jitAuthorization:
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                phase:
                  type: string
                allowed:
                  type: integer
                denied:
                  type: integer
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Threshold
          type: number
          jsonPath: .spec.trustThreshold
