apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: publications.autonomyx.io
spec:
  group: autonomyx.io
  scope: Namespaced
  names:
    plural: publications
    singular: publication
    kind: Publication
    shortNames:
      - axp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [domain, artifact, immutable]
              properties:
                domain:
                  type: string
                artifact:
                  type: string
                version:
                  type: string
                immutable:
                  type: boolean
                  default: true
                effectiveFrom:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
                certificationRef:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                digest:
                  type: string
                publishedAt:
                  type: string
                  format: date-time
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Phase
          type: string
          jsonPath: .status.phase
