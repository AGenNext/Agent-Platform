apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: domains.autonomyx.io
spec:
  group: autonomyx.io
  scope: Cluster
  names:
    plural: domains
    singular: domain
    kind: Domain
    shortNames:
      - axd
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [name, scope]
              properties:
                name:
                  type: string
                scope:
                  type: string
                  enum: [foundation, governance, runtime, oam, experience]
                ownerRef:
                  type: string
                  description: External owner reference. Owner remains outside runtime authority.
                status:
                  type: string
                  enum: [trusted, verified, suspended]
                policies:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                trustScore:
                  type: number
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Scope
          type: string
          jsonPath: .spec.scope
        - name: Status
          type: string
          jsonPath: .spec.status
        - name: Trust
          type: number
          jsonPath: .status.trustScore
