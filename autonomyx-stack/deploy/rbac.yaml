apiVersion: v1
kind: ServiceAccount
metadata:
  name: autonomyx-controller
  namespace: autonomyx-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autonomyx-controller
rules:
  - apiGroups: ["autonomyx.io"]
    resources:
      - autonomyxmanifests
      - domains
      - gates
      - publications
      - certifications
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autonomyx.io"]
    resources:
      - autonomyxmanifests/status
      - domains/status
      - gates/status
      - publications/status
      - certifications/status
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autonomyx-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: autonomyx-controller
subjects:
  - kind: ServiceAccount
    name: autonomyx-controller
    namespace: autonomyx-system
