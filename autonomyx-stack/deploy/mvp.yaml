apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autonomyx-mvp-state
  namespace: autonomyx-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: autonomyx-mvp-auth
  namespace: autonomyx-system
type: Opaque
stringData:
  token: change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomyx-mvp
  namespace: autonomyx-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autonomyx-mvp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autonomyx-mvp
    spec:
      serviceAccountName: autonomyx-controller
      containers:
        - name: mvp
          image: ghcr.io/agennext/autonomyx-controller:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AUTONOMYX_MVP_PORT
              value: "8080"
            - name: AUTONOMYX_STATE_FILE
              value: /var/lib/autonomyx/state/autonomyx-state.json
            - name: AUTONOMYX_MVP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autonomyx-mvp-auth
                  key: token
          volumeMounts:
            - name: state
              mountPath: /var/lib/autonomyx/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: autonomyx-mvp-state
---
apiVersion: v1
kind: Service
metadata:
  name: autonomyx-mvp
  namespace: autonomyx-system
spec:
  selector:
    app.kubernetes.io/name: autonomyx-mvp
  ports:
    - name: http
      port: 80
      targetPort: http
