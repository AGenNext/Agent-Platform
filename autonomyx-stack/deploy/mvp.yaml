apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomyx-mvp
  namespace: autonomyx-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autonomyx-mvp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autonomyx-mvp
    spec:
      serviceAccountName: autonomyx-controller
      containers:
        - name: mvp
          image: ghcr.io/agennext/autonomyx-controller:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AUTONOMYX_MVP_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: autonomyx-mvp
  namespace: autonomyx-system
spec:
  selector:
    app.kubernetes.io/name: autonomyx-mvp
  ports:
    - name: http
      port: 80
      targetPort: http
