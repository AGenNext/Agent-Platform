name: Autonomyx Stack Check

on:
  pull_request:
    paths:
      - "autonomyx-stack/**"
  push:
    branches:
      - autonomyx-oam-stack
    paths:
      - "autonomyx-stack/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autonomyx-stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: autonomyx-stack/package.json
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run validate:stack
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: autonomyx-stack
          push: false
          tags: ghcr.io/agennext/autonomyx-controller:0.1.0
          load: false
