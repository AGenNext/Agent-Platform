name: Autonomyx Stack Check

on:
  pull_request:
    paths:
      - "autonomyx-stack/**"
  push:
    branches:
      - autonomyx-oam-stack
    paths:
      - "autonomyx-stack/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autonomyx-stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: autonomyx-stack/package.json
      - run: npm install
      - run: npm run check
