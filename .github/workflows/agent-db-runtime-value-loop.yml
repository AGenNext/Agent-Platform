name: Agent DB Runtime Value Loop Validation

on:
  push:
    paths:
      - 'packages/agent-db-runtime/**'
      - '.github/workflows/agent-db-runtime-value-loop.yml'
  pull_request:
    paths:
      - 'packages/agent-db-runtime/**'
      - '.github/workflows/agent-db-runtime-value-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  value-loop-validation:
    name: Validate value loop runtime slice
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/agent-db-runtime
    env:
      SURREAL_VERSION: v2.3.10
      SURREAL_CONN: --endpoint http://127.0.0.1:8000 --username root --password root --namespace agennext --database agent_runtime_value_loop

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install SurrealDB CLI
        working-directory: /tmp
        run: |
          curl -sSL "https://github.com/surrealdb/surrealdb/releases/download/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz" | tar xz
          sudo install -m 0755 surreal /usr/local/bin/surreal
          surreal version

      - name: Start SurrealDB (in-memory)
        run: |
          surreal start --user root --pass root memory &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "SurrealDB is healthy"
              exit 0
            fi
            echo "Waiting for SurrealDB..."
            sleep 1
          done
          echo "SurrealDB did not become healthy"
          exit 1

      - name: Apply value-loop design schema
        run: |
          surreal import $SURREAL_CONN schema/design/runtime-meta-model.surql
          surreal import $SURREAL_CONN schema/design/value-loop-phase1.surql

      - name: Run value-loop smoke script
        run: surreal import $SURREAL_CONN tests/value-loop-smoke.surql

      - name: Assert value-loop records
        run: surreal import $SURREAL_CONN tests/value-loop-asserts.surql

      - name: Capture value-loop evidence
        if: always()
        run: |
          mkdir -p reports/evidence
          printf 'SELECT count() AS count FROM output GROUP ALL;SELECT count() AS count FROM outcome GROUP ALL;SELECT count() AS count FROM value_realization GROUP ALL;SELECT count() AS count FROM learning GROUP ALL;SELECT count() AS count FROM improvement GROUP ALL;' \
            | surreal sql $SURREAL_CONN --json > reports/evidence/value-loop-validation-output.json || true
          echo "value-loop evidence:"
          cat reports/evidence/value-loop-validation-output.json || true
