name: Agent DB Runtime Gates

on:
  pull_request:
    paths:
      - "packages/agent-db-runtime/**"
      - ".github/workflows/agent-db-runtime-gates.yml"
  push:
    branches:
      - main
    paths:
      - "packages/agent-db-runtime/**"
      - ".github/workflows/agent-db-runtime-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent-db-runtime:
    name: Validate Agent DB Runtime
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: packages/agent-db-runtime

    env:
      SURREAL_VERSION: v2.3.10
      SURREAL_CONN: --endpoint http://127.0.0.1:8000 --username root --password root --namespace agennext --database agent_runtime_ci

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install SurrealDB CLI
        working-directory: /tmp
        run: |
          curl -sSL "https://github.com/surrealdb/surrealdb/releases/download/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz" | tar xz
          sudo install -m 0755 surreal /usr/local/bin/surreal
          surreal version

      - name: Start SurrealDB (in-memory)
        run: |
          surreal start --user root --pass root memory &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "SurrealDB is healthy"
              exit 0
            fi
            echo "Waiting for SurrealDB..."
            sleep 1
          done
          echo "SurrealDB did not become healthy"
          exit 1

      - name: Apply core schema (load order)
        run: |
          while read -r f; do
            [ -z "$f" ] && continue
            echo "apply $f"
            surreal import $SURREAL_CONN "$f"
          done < schema/load-order.txt

      - name: Seed bootstrap records
        run: surreal import $SURREAL_CONN schema/seed.surql

      - name: Run smoke assertions
        run: surreal import $SURREAL_CONN tests/smoke.surql

      - name: Run regression tests
        run: surreal import $SURREAL_CONN tests/regression.surql

      - name: Backup and disaster-recovery restore check
        run: |
          # Back up the seeded database.
          surreal export $SURREAL_CONN /tmp/backup.surql
          # Extract data statements (records export as single-line INSERT/RELATE).
          # Schema is restored from version control, data from the backup -- this
          # also sidesteps SurrealDB's array<object> field DDL re-import conflict.
          { echo "OPTION IMPORT;"; grep -E '^(INSERT|RELATE)' /tmp/backup.surql; } > /tmp/data-only.surql
          DR="--endpoint http://127.0.0.1:8000 --username root --password root --namespace agennext --database agent_runtime_dr"
          while read -r f; do
            [ -z "$f" ] && continue
            surreal import $DR "$f"
          done < schema/load-order.txt
          surreal import $DR /tmp/data-only.surql
          # Verify the restored database passes the same gates.
          surreal import $DR tests/smoke.surql
          surreal import $DR tests/regression.surql

  persistence:
    name: Verify file-backed persistence
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: packages/agent-db-runtime

    env:
      SURREAL_VERSION: v2.3.10
      SURREAL_CONN: --endpoint http://127.0.0.1:8000 --username root --password root --namespace agennext --database agent_runtime_persist

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install SurrealDB CLI
        working-directory: /tmp
        run: |
          curl -sSL "https://github.com/surrealdb/surrealdb/releases/download/${SURREAL_VERSION}/surreal-${SURREAL_VERSION}.linux-amd64.tgz" | tar xz
          sudo install -m 0755 surreal /usr/local/bin/surreal
          surreal version

      - name: Apply + seed, restart file-backed store, verify data survives
        run: |
          wait_healthy() {
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && return 0
              sleep 1
            done
            echo "SurrealDB did not become healthy"; return 1
          }
          # First boot on a persistent rocksdb store.
          surreal start --user root --pass root rocksdb:/tmp/persist-db --bind 127.0.0.1:8000 &
          SRV=$!
          wait_healthy
          while read -r f; do
            [ -z "$f" ] && continue
            surreal import $SURREAL_CONN "$f"
          done < schema/load-order.txt
          surreal import $SURREAL_CONN schema/seed.surql
          # Stop the server.
          kill "$SRV"; sleep 3
          # Reboot against the same store -- data must still be there.
          surreal start --user root --pass root rocksdb:/tmp/persist-db --bind 127.0.0.1:8000 &
          SRV2=$!
          wait_healthy
          surreal import $SURREAL_CONN tests/smoke.surql
          surreal import $SURREAL_CONN tests/regression.surql
          kill "$SRV2"

