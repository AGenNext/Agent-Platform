name: E2E Tests

# NOTE: Per the no-hidden-runtime-logic governance rule, CI/CD YAML must not
# invoke language or test runners as hidden validation engines. The unit and
# UI/e2e suites therefore run on the client/edge before submission; this
# workflow builds the stack and smoke-checks service health only.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ── Build + smoke (unit suite runs client-side per governance) ─────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Governance note
        run: |
          echo "Unit suite runs on the client/edge before submission."
          echo "CI performs build + smoke validation only (governance: no-hidden-runtime-logic)."

  # ── Full stack: build + health smoke (UI/API suites run client-side) ───────
  e2e:
    name: E2E & UI Tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for agent-knowledge to be healthy
        run: |
          echo "Waiting for agent-knowledge..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "agent-knowledge is healthy after ${i} attempts"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "ERROR: agent-knowledge did not become healthy in time"
              docker compose logs agent-knowledge | tail -50
              exit 1
            fi
            sleep 5
          done

      - name: Wait for agent-dashboard to be healthy
        run: |
          echo "Waiting for agent-dashboard..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "agent-dashboard is healthy after ${i} attempts"
              break
            fi
            sleep 5
          done

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== agent-knowledge ===" && docker compose logs agent-knowledge | tail -100
          echo "=== agent-dashboard ===" && docker compose logs agent-dashboard | tail -50
          echo "=== surrealdb ===" && docker compose logs surrealdb | tail -30

      - name: Stop stack
        if: always()
        run: docker compose down -v
